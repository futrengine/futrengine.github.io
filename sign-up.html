<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - FUTRENGINE</title>
    <link rel="stylesheet" href="styles-s.css">
</head>
<body>
    <div class="container">
        <h2>Sign Up</h2>
        <input type="text" id="sign-up-name" class="auth-input" placeholder="Full Name" required>
        <input type="text" id="sign-up-phone" class="auth-input" placeholder="Phone Number" required>
        <input type="email" id="sign-up-email" class="auth-input" placeholder="Email" required>
        <input type="password" id="sign-up-password" class="auth-input" placeholder="Password" required>
        <button onclick="signUp()" class="auth-button">Sign Up</button>
        <p id="sign-up-message"></p>
        <p>Already have an account? <a href="sign-in.html">Sign In</a></p>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
