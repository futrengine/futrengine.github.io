<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - FUTRENGINE</title>
    <link rel="stylesheet" href="styles-s.css">
</head>
<body>
    <div class="container">
        <h2>Sign In</h2>
        <input type="text" id="sign-in-identifier" class="auth-input" placeholder="Email or Phone" required>
        <input type="password" id="sign-in-password" class="auth-input" placeholder="Password" required>
        <button onclick="signIn()" class="auth-button">Sign In</button>
        <p id="sign-in-message"></p>
        <p>Don't have an account? <a href="sign-up.html">Sign Up</a></p>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
