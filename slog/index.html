<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text with Audio</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://fpyf8.com/88/tag.min.js" data-zone="153280" async data-cfasync="false"></script>
</head>
<body>

    <div class="container">
        <h1>Welcome to My Professional Page</h1>
        <p>This page provides audio in both English and Malayalam.</p>
    </div>

    <!-- Audio Players (Outside Container, Aligned Right) -->
    <div class="audio-container">
        <div class="audio-controls">
            <h2>English Audio</h2>
            <audio id="englishAudio" src="english.mp3" ontimeupdate="updateSeek('englishAudio', 'englishSeek')"></audio>
            <div class="player">
                <button onclick="seekBack('englishAudio')">⏪ 10s</button>
                <button onclick="togglePlay('englishAudio')">▶️/⏸</button>
                <button onclick="seekForward('englishAudio')">10s ⏩</button>
            </div>
            <input type="range" id="englishSeek" value="0" max="100" step="1" oninput="seekAudio('englishAudio', this.value)">
        </div>

        <div class="audio-controls">
            <h2>Malayalam Audio</h2>
            <audio id="malayalamAudio" src="malayalam.mp3" ontimeupdate="updateSeek('malayalamAudio', 'malayalamSeek')"></audio>
            <div class="player">
                <button onclick="seekBack('malayalamAudio')">⏪ 10s</button>
                <button onclick="togglePlay('malayalamAudio')">▶️/⏸</button>
                <button onclick="seekForward('malayalamAudio')">10s ⏩</button>
            </div>
            <input type="range" id="malayalamSeek" value="0" max="100" step="1" oninput="seekAudio('malayalamAudio', this.value)">
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
