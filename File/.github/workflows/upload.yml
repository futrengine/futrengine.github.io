name: Upload Redirect Alias

on:
  push:
    paths:
      - "alias.json"
  schedule:
    - cron: "*/5 * * * *"  # Runs every 5 minutes

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Read Alias JSON
        id: read_json
        run: |
          echo "::set-output name=alias::$(jq -r .alias alias.json)"
          echo "::set-output name=url::$(jq -r .url alias.json)"

      - name: Generate Redirect File
        run: |
          echo '<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url="${{ steps.read_json.outputs.url }}">
              <script>window.location.href = "${{ steps.read_json.outputs.url }}";</script>
          </head>
          <body>
              <p>Redirecting to <a href="${{ steps.read_json.outputs.url }}">${{ steps.read_json.outputs.url }}</a>...</p>
          </body>
          </html>' > File/${{ steps.read_json.outputs.alias }}.html

      - name: Commit and Push
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add File/${{ steps.read_json.outputs.alias }}.html
          git commit -m "Added redirect for ${{ steps.read_json.outputs.alias }}"
          git push