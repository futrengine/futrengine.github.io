<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jachu Test - Internet Speed Test</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-inter antialiased flex items-center justify-center min-h-screen p-4">
    <div class="container bg-white shadow-lg rounded-xl p-6 md:p-8 w-full max-w-md mx-auto">
        <h1 class="text-3xl md:text-4xl font-bold text-center text-gray-800 mb-6">Jachu Test</h1>

        <div class="grid grid-cols-1 gap-4 mb-6">
            <!-- Ping Section -->
            <div class="bg-blue-50 p-4 rounded-lg flex items-center justify-between">
                <span class="text-blue-700 font-semibold text-lg">Ping:</span>
                <span id="pingResult" class="text-blue-900 text-xl font-bold">-- ms</span>
            </div>
            <!-- Download Section -->
            <div class="bg-green-50 p-4 rounded-lg flex items-center justify-between">
                <span class="text-green-700 font-semibold text-lg">Download:</span>
                <span id="downloadResult" class="text-green-900 text-xl font-bold">-- Mbps</span>
            </div>
            <!-- Upload Section -->
            <div class="bg-purple-50 p-4 rounded-lg flex items-center justify-between">
                <span class="text-purple-700 font-semibold text-lg">Upload:</span>
                <span id="uploadResult" class="text-purple-900 text-xl font-bold">-- Mbps</span>
            </div>
        </div>

        <!-- Start Test Button -->
        <button id="startButton" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-75">
            Start Test
        </button>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="hidden text-center mt-4 text-gray-600 font-medium">
            <svg class="animate-spin h-6 w-6 text-indigo-600 mx-auto mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p>Testing your internet speed...</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm text-center">
            An error occurred during the test. Please try again.
        </div>

        <!-- Detailed Results Section (initially hidden) -->
        <div id="detailedResults" class="hidden mt-6 pt-6 border-t border-gray-200">
            <h2 class="text-xl font-semibold text-gray-800 mb-4 text-center">Detailed Results</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-gray-50 p-3 rounded-lg">
                    <span class="text-gray-700 font-medium">Download (MBps):</span>
                    <span id="downloadMBps" class="text-gray-900 font-bold ml-2">-- MBps</span>
                </div>
                <div class="bg-gray-50 p-3 rounded-lg">
                    <span class="text-gray-700 font-medium">Download (Kbps):</span>
                    <span id="downloadKbps" class="text-gray-900 font-bold ml-2">-- Kbps</span>
                </div>
                <div class="bg-gray-50 p-3 rounded-lg">
                    <span class="text-gray-700 font-medium">Upload (MBps):</span>
                    <span id="uploadMBps" class="text-gray-900 font-bold ml-2">-- MBps</span>
                </div>
                <div class="bg-gray-50 p-3 rounded-lg">
                    <span class="text-gray-700 font-medium">Upload (Kbps):</span>
                    <span id="uploadKbps" class="text-gray-900 font-bold ml-2">-- Kbps</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
