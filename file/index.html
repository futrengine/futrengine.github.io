<!DOCTYPE html>
<html>
<head>
  <title>Redirecting...</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }

    .loader {
      border: 8px solid #f3f3f3;
      border-top: 8px solid #3498db;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .msg { font-size: 18px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>
  <div class="loader"></div>
  <div class="msg">⏳ Redirecting...</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBKA3bxy1caa0QiGrn6AihtxufiO7xxTnI",
    authDomain: "futrshortener-7acf0.firebaseapp.com",
    databaseURL: "https://futrshortener-7acf0-default-rtdb.firebaseio.com",
    projectId: "futrshortener-7acf0",
    storageBucket: "futrshortener-7acf0.appspot.com",
    messagingSenderId: "863839648409",
    appId: "1:863839648409:web:d20ae154fe1c9dc1b19608"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const urlParams = new URLSearchParams(window.location.search);
  const alias = urlParams.get('alias');

  const showError = (msg) => {
    document.body.innerHTML = `<h2>❌ ${msg}</h2>`;
  };

  if (!alias) {
    showError("No alias provided.");
  } else {
    db.ref("links/" + alias).once("value").then(snapshot => {
      if (!snapshot.exists()) {
        showError("Link not found.");
        return;
      }

      const data = snapshot.val();
      const { url, password } = data;

      if (!password || password === "null") {
        // No password → Redirect immediately
        window.location.href = url;
      } else {
        // Password required → Ask user
        document.body.innerHTML = `
          <h2>🔐 Password Required</h2>
          <input type="password" id="pwInput" placeholder="Enter password" />
          <button onclick="checkPassword()">Unlock</button>
          <p id="status"></p>
        `;

        window.checkPassword = function () {
          const userPw = document.getElementById("pwInput").value.trim();
          const status = document.getElementById("status");

          if (userPw === password) {
            status.innerText = "✅ Correct! Redirecting...";
            setTimeout(() => {
              window.location.href = url;
            }, 1000);
          } else {
            status.innerText = "❌ Incorrect password. Try again.";
          }
        };
      }
    });
  }
</script>

</body>
</html>
