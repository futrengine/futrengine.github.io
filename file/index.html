<!DOCTYPE html>
<html>
<head>
  <title>Redirecting...</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f0f4f8;
      color: #333;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 8px solid #e0e0e0;
      border-top: 8px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message {
      font-size: 1.2rem;
      text-align: center;
    }

    .create-link {
      position: absolute;
      bottom: 20px;
      padding: 10px 20px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="message">⏳ Redirecting... Please wait</div>
  <button class="create-link" onclick="window.location.href='create.html'">Create Short Link</button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBKA3bxy1caa0QiGrn6AihtxufiO7xxTnI",
      authDomain: "futrshortener-7acf0.firebaseapp.com",
      databaseURL: "https://futrshortener-7acf0-default-rtdb.firebaseio.com",
      projectId: "futrshortener-7acf0",
      storageBucket: "futrshortener-7acf0.appspot.com",
      messagingSenderId: "863839648409",
      appId: "1:863839648409:web:d20ae154fe1c9dc1b19608"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const alias = urlParams.get('alias');

    const messageEl = document.querySelector(".message");

    if (!alias) {
      messageEl.innerHTML = "❌ No alias provided.";
      document.querySelector(".spinner").style.display = "none";
    } else {
      db.ref("links/" + alias).once("value").then(snapshot => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          const url = data.url;
          const expiry = data.expiry; // timestamp in ms or "no_limit"

          const now = Date.now();
          if (expiry !== "no_limit" && now > expiry) {
            messageEl.innerHTML = "⛔ This link has expired.";
            document.querySelector(".spinner").style.display = "none";
            return;
          }

          // Update click count
          const currentClicks = data.clicks || 0;
          db.ref("links/" + alias).update({ clicks: currentClicks + 1 });

          // Redirect
          setTimeout(() => {
            window.location.href = url;
          }, 1500); // delay for UI
        } else {
          // Custom 404-style error
          messageEl.innerHTML = `
            🚫 <strong>404</strong> - Link not found.<br>
            The link you tried to visit does not exist.`;
          document.querySelector(".spinner").style.display = "none";
        }
      }).catch(error => {
        messageEl.textContent = "❌ Error accessing the link.";
        console.error(error);
        document.querySelector(".spinner").style.display = "none";
      });
    }
  </script>
</body>
</html>
